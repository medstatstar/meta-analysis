<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meta-analysis 工作台</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --ink: #1f2a37; --muted: #6b7785;
    --line: #e2e8f0; --accent: #2563eb; --accent-soft: #eff6ff;
    --soft: #f59e0b; --soft-soft: #fffbeb; --red: #dc2626; --red-soft: #fef2f2;
    --green: #16a34a; --green-soft: #f0fdf4; --done: #d1fae5; --pending: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); font-size: 14px; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px;
           display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 280px 1fr 300px; gap: 16px; padding: 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  /* timeline */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; margin-bottom: 4px; }
  .tl li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pending); flex: 0 0 auto; }
  .tl li.done .dot { background: var(--green); }
  .tl li.await .dot { background: var(--soft); box-shadow: 0 0 0 4px var(--soft-soft); }
  .tl li.gate .dot { background: var(--red); }
  .tl li.future { opacity: .45; }
  .tl li .lbl { font-size: 13px; }
  .tl li .tag { margin-left: auto; font-size: 11px; color: var(--muted); }
  .tl li.await { background: var(--soft-soft); }
  .tl li.gate.await { background: var(--red-soft); }
  /* forms */
  .node-title { font-size: 18px; margin: 0 0 4px; }
  .node-intro { color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  .panel { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .panel > .pl { font-weight: 600; margin-bottom: 8px; font-size: 13px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  table.grid th { background: var(--bg); color: var(--muted); font-weight: 600; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  .kv .alert { color: var(--red); font-weight: 600; }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 6px;
             padding: 8px; font-family: inherit; font-size: 13px; resize: vertical; }
  input[type=text], input[type=number] { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%; }
  .json { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
          font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; max-height: 360px; overflow: auto; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.soft { background: var(--soft-soft); color: var(--soft); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  /* actions */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  button { border: none; border-radius: 7px; padding: 9px 16px; font-size: 13px; font-weight: 600;
           cursor: pointer; font-family: inherit; transition: opacity .15s ease, transform .05s ease; }
  button:active { transform: translateY(1px); }
  .btn-approve { background: var(--green); color: #fff; }
  .btn-revise { background: var(--accent); color: #fff; }
  .btn-skip { background: var(--soft); color: #fff; }
  .btn-reject { background: var(--red); color: #fff; }
  .btn-ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .btn-mini { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px;
              font-size: 12px; border-radius: 6px; border: 1px solid var(--accent);
              background: var(--accent); color: #fff; cursor: pointer; line-height: 1.2; }
  .btn-mini.file { background: var(--green); border-color: var(--green); }
  .rl-xlsx-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                 margin-bottom: 10px; padding: 8px 10px; background: var(--soft);
                 border-radius: 6px; border: 1px solid var(--line); }
  .rl-xlsx-hint { font-size: 12px; color: var(--muted); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .note { flex: 1; min-width: 200px; }
  .acts-hint { flex: 0 0 100%; font-size: 12px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 4px; }
  .a4assign-sel { max-width: 420px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 12px; line-height: 1.5; }
  label.chk { display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--ink); margin: 12px 0 4px; }
  .feas-kv { display: flex; flex-direction: column; gap: 2px; }
  .feas-kv .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .feas-kv .row .k { color: var(--muted); }
  .feas-kv .row .v { font-weight: 600; }
  .feas-kv .row .v.miss { color: #c0392b; font-weight: 500; }
  .hint.warn { color: #c0392b; background: #fdecea; border-radius: 6px; padding: 8px 10px; }
  .hint.ok { color: #1e7e34; }
  .feas-verdict { border-left: 3px solid var(--accent); }
  .query { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
           background: var(--code-bg, #f4f5f7); border-radius: 6px; padding: 8px 10px; margin: 6px 0;
           word-break: break-all; color: var(--ink); }
  .paper { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.5; }
  .paper a { color: var(--accent); text-decoration: none; }
  .paper a:hover { text-decoration: underline; }
  .paper .yr { color: var(--muted); font-size: 12px; }
  /* start */
  .start { max-width: 520px; margin: 40px auto; }
  .start label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .audit { font-size: 12px; }
  .audit .row { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .audit .row .a { font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; }
  .flash { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; transition: opacity .35s ease; }
  .flash.err { background: var(--red-soft); color: var(--red); }
  .flash.ok { background: var(--green-soft); color: var(--green); }
  .done-banner { background: var(--green-soft); color: var(--green); border: 1px solid #bbf7d0;
                 padding: 14px; border-radius: 8px; font-weight: 600; }
  .rewind { font-size: 11px; color: var(--muted); margin-left: auto; }
  /* A4 实时预览 */
  .a4row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; }
  .a4dot { width:8px; height:8px; border-radius:50%; background:var(--pending); flex:0 0 auto; }
  .a4title { font-weight:500; max-width:42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .a4badge { flex:0 0 auto; }
  .a4reason { color:var(--muted); font-size:12px; margin-left:auto; text-align:right; max-width:46%; }
  /* A4 逐篇文档展示 */
  .a4doc { border:1px solid var(--line); border-radius:10px; margin:10px 0; overflow:hidden; min-width:0; max-width:100%; }
  .a4doc-head { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel-2); flex-wrap:wrap; }
  .a4doc-idx { font-weight:700; color:var(--accent); }
  .a4doc-head .a4title { max-width:52%; white-space:normal; word-break:break-word; }
  .a4doi { color:var(--muted); font-size:11px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .a4doc-body { padding:8px 12px 12px; }
  .a4row2 { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; background:#fff; }
  .a4row2-k { font-weight:600; margin-bottom:6px; display:flex; gap:8px; align-items:center; }
  .a4row2 .tag { font-size:11px; background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:6px; }
  .a4row2 .tag2 { font-size:11px; background:#fef3c7; color:#92400e; padding:1px 6px; border-radius:6px; }
  /* A4 续跑逐篇实时进度 */
  .a4live { display:flex; flex-direction:column; gap:6px; }
  .a4live-doc { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid #e5e7eb; border-radius:8px; background:var(--panel); }
  .a4live-idx { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--muted); flex:0 0 auto; width:30px; }
  .a4live-title { font-weight:600; flex:0 1 38%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .a4live-badge { flex:0 0 auto; }
  .a4live-reason { color:var(--muted); font-size:12px; margin-left:auto; text-align:right; max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .a4row2-grid { display:grid; grid-template-columns:auto 1fr 1fr; gap:4px 10px; align-items:center; font-size:12px; }
  .a4row2-grid label { color:var(--muted); }
  .a4cell { width:74px; padding:3px 6px; border:1px solid var(--line); border-radius:5px; font-size:13px; }
  .a4row2-anchor { margin-top:6px; font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .a4page { margin-top:8px; text-align:center; background:#525659; padding:8px; border-radius:6px; }
  .a4page img { max-width:100%; }
  .a4page-cap { color:#e5e7eb; font-size:11px; margin-top:4px; }
  .a4doc-actions { margin-top:8px; }
  .a4up-card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  .a4up-card .a4title { max-width:none; white-space:normal; font-weight:500; }
  /* 底部信息栏：滚动显示后台输出 / 进度 */
  body { padding-bottom: 176px; }
  body.log-collapsed { padding-bottom: 46px; }
  #logbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
            background: var(--panel); border-top: 1px solid var(--line);
            box-shadow: 0 -2px 10px rgba(15,23,42,.06); }
  #logbar-head { display: flex; align-items: center; gap: 10px; padding: 7px 16px;
                 cursor: pointer; user-select: none; font-size: 12px; }
  #logbar-head .title { font-weight: 700; }
  #logbar-head .spacer { margin-left: auto; }
  #logbar-body { height: 130px; overflow-y: auto; padding: 4px 16px 10px;
                 font-family: ui-monospace, Menlo, Consolas, monospace;
                 font-size: 12px; line-height: 1.65; }
  #logbar.collapsed #logbar-body { display: none; }
  .logline { display: flex; gap: 8px; white-space: pre-wrap; word-break: break-word; }
  .logline .ts { color: var(--muted); flex: 0 0 auto; }
  .logline .msg { color: var(--ink); }
  .logline.err .msg { color: var(--red); font-weight: 600; }
  .logline.warn .msg { color: var(--soft); }
  .logline.ok .msg { color: var(--green); }
  .spin { display: inline-block; animation: spin360 .9s linear infinite; }
  @keyframes spin360 { to { transform: rotate(360deg); } }

  /* A3 初筛逐条裁决：筛选栏 / 展开详情 / 三态着色 */
  .rl-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .rlf-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
             padding: 5px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; }
  .rlf-btn:hover { border-color: var(--accent); }
  .rlf-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .rl-filter-hint { color: var(--muted); font-size: 12px; margin-left: 4px; }
  table.rl th, table.rl td { vertical-align: top; }
  .rl-row.dec-include { background: var(--green-soft); }
  .rl-row.dec-exclude { background: var(--red-soft); }
  .rl-row.dec-uncertain { background: var(--soft-soft); }
  .rl-title { cursor: pointer; }
  .rl-toggle { display: inline-block; width: 14px; color: var(--accent); user-select: none; }
  .rl-title-link { color: var(--accent); text-decoration: none; cursor: pointer; }
  .rl-title-link:hover { text-decoration: underline; }
  tr.rl-detail { display: none; }
  tr.rl-detail.open { display: table-row; }
  .rl-detail-inner { padding: 10px 12px; background: var(--bg); border: 1px dashed var(--line);
                      border-radius: 6px; margin: 2px 0; display: grid;
                      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 18px; }
  .rl-df { font-size: 12.5px; line-height: 1.5; }
  .rl-df.wide { grid-column: 1 / -1; }
  .rl-df-k { color: var(--muted); display: inline-block; min-width: 64px; margin-right: 6px; }
  .rl-df-v { color: var(--ink); }
  .rl-sel { padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); font-size: 13px; }
  .rl-sel-include { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .rl-sel-exclude { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .rl-sel-uncertain { background: var(--soft-soft); color: var(--soft); border-color: var(--soft); }
</style>
</head>
<body class="log-collapsed">
<header>
  <h1>🧬 meta-analysis 工作台</h1>
  <span class="meta" id="hdr-meta"></span>
  <button class="btn-ghost" id="btn-new" style="margin-left:auto">＋ 新建</button>
</header>

<div class="layout" id="app">
  <div class="card"><h3>流程进度</h3><ul class="tl" id="timeline"></ul></div>
  <div class="card" id="center"><!-- node form / start --></div>
  <div class="card"><h3>审计日志</h3><div class="audit" id="audit"><span class="empty">暂无决策</span></div>
    <div class="rewind">↺ 回退重跑：Phase 2</div></div>
</div>

<div id="logbar" class="collapsed">
  <div id="logbar-head" onclick="toggleLog()">
    <span class="title">🗂 后台输出</span>
    <span id="logbar-status"><span class="pill">✓ 空闲</span></span>
    <span class="spacer"></span>
    <span id="logbar-count" class="rewind">0 行</span>
    <span id="logbar-toggle">▴ 展开</span>
  </div>
  <div id="logbar-body"><div id="log-lines"></div></div>
</div>

<script>
// 全流程阶段计划（时间轴骨架；真实进度由后端 /api/session 的 progress 覆盖）
const STAGE_ORDER = [
  ["A","A1.topic_selection","选题"],["A","A2.literature_search","检索"],
  ["A","A3.screening","初筛"],["A","A4.data_extraction","数据提取"],
  ["B","B1.meta","合并计算"],["B","B2.grade","GRADE"],["B","B3.overclaim","过度声明"],
  ["B","B4.quality_gate","质量门"],["C","C1.draft","初稿"],["C","C2.ai_review","AI 评审"],
  ["C","C3.ref_verify","参考核验"],["C","C4.evidence_qa","投稿前 QA"],
];

let STATE = null;       // 当前后端状态
let DRAFT = {};         // revision_key -> 编辑后的值

// ---------- A3 初筛逐条裁决：筛选 / 展开 / 三态下拉 ----------
let A3_FILTER = "";                       // 当前筛选的决策值（"" = 全部）
const A3_EXPANDED = new Set();            // 已展开详情的原始行索引
let _LAST_ROWLIST = null;                 // 最近一次渲染的 rowlist 上下文

function draftCell(rk, i, k, fallback) {
  const arr = DRAFT[rk];
  if (arr && arr[i] && arr[i][k] !== undefined) return arr[i][k];
  return fallback;
}
function bindDraftInputs(root) {
  (root || document).querySelectorAll("[data-rk]").forEach(el => {
    el.addEventListener("input", () => collectDraft(el));
    el.addEventListener("change", () => collectDraft(el));
  });
}
function reRenderRowlist(rk) {
  if (!_LAST_ROWLIST || _LAST_ROWLIST.rk !== rk) return;
  const el = document.getElementById("rowlist-" + rk);
  if (!el) return;
  el.outerHTML = `<div id="rowlist-${rk}">${renderRowlist(_LAST_ROWLIST.p, _LAST_ROWLIST.data, {})}</div>`;
  bindDraftInputs(document.getElementById("rowlist-" + rk));
}
function a3SetFilter(v) {
  A3_FILTER = (A3_FILTER === v) ? "" : v;   // 同值再点 = 取消筛选
  reRenderRowlist("screened");
}
function a3ToggleExpand(i) {
  if (A3_EXPANDED.has(i)) A3_EXPANDED.delete(i); else A3_EXPANDED.add(i);
  reRenderRowlist("screened");
}

const $ = (s, el=document) => el.querySelector(s);
// 默认后端地址（与 launch_workbench.py 默认 --port 8765 一致）。
// 若页面以 file:// 协议直接打开（双击 HTML），相对 fetch 会解析成 file:///api/...
// 导致 “Failed to fetch”；此时回退到该默认地址，保证双击也能用。
// 自定义端口请改用 launch_workbench.py，它会自动打开正确地址。
const WB_BASE = "http://127.0.0.1:8765";
function apiUrl(path) {
  return (location.protocol === "file:") ? (WB_BASE + path) : path;
}
function api(path, opts) {
  return fetch(apiUrl(path), Object.assign({headers: {"Content-Type":"application/json"}}, opts))
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status + " " + (r.statusText))))
    .catch(err => {
      if (err instanceof TypeError) {
        throw new Error("无法连接后端（" + err.message + "）。请通过 " + WB_BASE +
          "/ 打开工作台，不要直接双击 HTML 文件；若用了自定义端口，请改用 launch_workbench.py 自动打开。");
      }
      throw err;
    });
}
function resolve(ctx, dotted) {
  return (dotted && typeof dotted === "string")
    ? dotted.split(".").reduce((o,k) => (o && o[k] !== undefined ? o[k] : null), ctx)
    : ctx;
}
let flashTimer = null;
function flash(msg, kind) {
  let f = $("#flash");
  if (!f) { f = document.createElement("div"); f.id = "flash"; $("#center").prepend(f); }
  f.className = "flash " + (kind || "ok"); f.textContent = msg; f.style.opacity = "1";
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    if (f) { f.style.opacity = "0";
      setTimeout(() => { f.textContent = ""; f.className = "flash"; }, 350); }
  }, 4500);
}
function clearFlash() {
  if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
  const f = $("#flash");
  if (f) { f.textContent = ""; f.className = "flash"; f.style.opacity = ""; }
}

// ---------- 启动 / 加载会话 ----------
async function startSession(topic, opt) {
  const btn = document.getElementById("btn-start");
  const label = btn ? (btn.dataset.label || "启动流程") : "启动流程";
  if (btn) { btn.disabled = true; btn.textContent = "⏳ 启动中…"; }
  setBusy(true, "启动流程");
  log("▶ 提交启动请求…");
  await streamPost("/api/start_stream", Object.assign(
      {topic, max_results:50, effect_measure:"OR", nma:false}, opt||{}), {
    onEvent(ev) {
      if (ev.event === "log") log(ev.msg, ev.level);
      else if (ev.event === "tick") { /* 计时已在底部状态栏显示，不刷屏 */ }
      else if (ev.event === "done") {
        if (ev.state) {
          STATE = ev.state; DRAFT = {};
          location.hash = "#" + encodeURIComponent(ev.state.session.path);
          render();
        }
      } else if (ev.event === "error") { log("✕ " + ev.message, "err"); flash(ev.message, "err"); }
    },
    onError(msg) {
      // 启动失败：清掉可能残留的坏 hash，避免下次重载再撞同一错误
      location.hash = "";
      log("✕ " + msg, "err");
      flash("启动失败：" + msg, "err");
    }
  });
  setBusy(false);
  if (btn) { btn.disabled = false; btn.textContent = label; }
}
async function loadSession(path) {
  try {
    STATE = await api("/api/session?path=" + encodeURIComponent(path));
    DRAFT = {}; render();
  } catch (e) {
    // 旧 session 路径失效（文件被清理 / 换了工作区 / 来自临时目录）→ 清坏 hash，回落到开始页，
    // 而非把工作台卡死在一个无法加载的 404 上。
    flash("会话已失效（" + e.message + "），已回到开始页，请重新发起。", "err");
    location.hash = "";
    STATE = null; renderStart();
  }
}

// ---------- 决策提交 ----------
async function decide(action, btn) {
  if (!STATE) return;
  const aw = STATE.await;
  // 防重复点击：立即禁用所有决策按钮并显示「提交中…」
  const buttons = $("#acts").querySelectorAll("button");
  buttons.forEach(b => { b.disabled = true; });
  if (btn) btn.textContent = "⏳ 提交中…";
  const note = ($("#note") || {}).value || "";
  const body = { session_path: STATE.session.path, stage_id: aw.stage_id,
                 action: action,
                 revision: Object.keys(DRAFT).length ? DRAFT : null, note };
  setBusy(true, "提交决策");
  log("▶ " + aw.stage_id + " → " + action
      + (body.revision ? "（含修订，将重算下游阶段）" : ""));
  await streamPost("/api/decide_stream", body, {
    onEvent(ev) {
      if (ev.event === "log") log(ev.msg, ev.level);
      else if (ev.event === "a4") { renderA4Live(ev.a4); }
      else if (ev.event === "done") {
        if (ev.state) { STATE = ev.state; DRAFT = {}; render(); }
        const done = ev.state && ev.state.await && ev.state.await.kind === "done";
        flash("已提交：" + action + (done ? " · 流程完成" : ""), "ok");
      } else if (ev.event === "error") { log("✕ " + ev.message, "err"); flash(ev.message, "err"); }
    },
    onError(msg) { log("✕ " + msg, "err"); flash("提交失败：" + msg, "err"); }
  });
  setBusy(false);
  // 未推进（失败）：恢复按钮，保留用户已填内容，不重渲染以免文本框被重置
  if (STATE && STATE.await && STATE.await.stage_id === aw.stage_id) {
    buttons.forEach(b => { b.disabled = false; if (b.dataset.label) b.textContent = b.dataset.label; });
  }
}

// ---------- 打回 / 回退（✕ 按钮）----------
// 打回不是「停在原地」，而是真正回退到某个更早的阶段并重算下游。
// 弹出目标选择器，确认后调用 /api/rewind（块级回退，清空该块及下游、保留审计）。
function openRejectPicker() {
  if (!STATE || !STATE.progress) { flash("无进度信息，无法打回", "err"); return; }
  const curSid = STATE.await.stage_id;
  const curBlock = (STATE.session.cursor && STATE.session.cursor.block)
                   || (curSid ? curSid[0] : "A");
  const prog = STATE.progress;
  const curIdx = prog.findIndex(p => p.stage_id === curSid);
  // 候选：块序早于当前块，或同块内更靠前的阶段（handoff_confirm 时 curIdx=-1，
  // 取当前块之前所有块 → 即「重做上一块」）。
  const cands = prog.filter(p => {
    if (!p.stage_id) return false;
    if (p.block < curBlock) return true;
    if (p.block === curBlock && curIdx > 0 && p.index < (prog[curIdx] ? prog[curIdx].index : 1e9)) return true;
    return false;
  });
  if (!cands.length) {
    flash("已是流程起点，没有更早的阶段可回退", "err"); return;
  }
  const box = $("#center");
  const opts = cands.map((c, i) =>
    `<option value="${esc(c.stage_id)}"${i === cands.length - 1 ? " selected" : ""}>${esc(c.stage_id)} · ${esc(c.block)}块</option>`).join("");
  const html =
    `<div class="panel" id="reject-picker" style="border-left:4px solid var(--red);margin-top:14px">` +
      `<div class="pl">✕ 打回 / 回退 · 选择目标阶段</div>` +
      `<p class="hint">系统将清空所选阶段及其之后所有结果，并重新计算下游（可能联网重新检索 / 抽取，耗时较长）。` +
      `审计已自动留痕。</p>` +
      `<div class="actions" style="flex-wrap:wrap">` +
        `<select id="reject-target" class="note" style="min-width:260px">${opts}</select>` +
        `<button class="btn-reject" id="reject-go">确认打回并回退</button>` +
        `<button class="btn-skip" onclick="renderNode()">取消</button>` +
      `</div>` +
    `</div>`;
  box.insertAdjacentHTML("beforeend", html);
  $("#reject-go").onclick = () => {
    const tgt = $("#reject-target").value;
    if (!tgt) return;
    rejectAndRewind(tgt);
  };
  $("#reject-target").focus();
}

async function rejectAndRewind(target) {
  if (!STATE) return;
  const sp = STATE.session.path;
  const note = ($("#note") || {}).value || "";
  setBusy(true, "回退并重建下游");
  log("✕ 打回到 " + target + "（下游块将重算）");
  try {
    const r = await fetch("/api/rewind", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_path: sp, target_stage_id: target, note: note || undefined }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || ("HTTP " + r.status));
    }
    const st = await r.json();
    STATE = st; DRAFT = {};
    render();
    flash("已打回到 " + target + "，下游块将重新计算", "ok");
  } catch (e) {
    log("✕ 回退失败：" + e.message, "err");
    flash("回退失败：" + e.message, "err");
  } finally {
    setBusy(false);
  }
}

async function a3UploadExcel(fileEl) {
  const file = fileEl.files && fileEl.files[0];
  if (!file) return;
  if (!STATE || !STATE.session) { flash("请先发起流程", "err"); return; }
  const sp = STATE.session.path;
  log("正在上传并更新裁决表：" + file.name);
  setBusy(true, "上传 Excel 并更新");
  try {
    const fd = new FormData();
    fd.append("session_path", sp);
    fd.append("file", file);
    const resp = await fetch(apiUrl("/api/upload_screening"), { method: "POST", body: fd });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({ detail: resp.statusText }));
      throw new Error(e.detail || ("HTTP " + resp.status));
    }
    const data = await resp.json();
    STATE = data.state; DRAFT = {}; render();
    const s = data.stats || {};
    log(`Excel 更新完成：匹配 ${s.matched || 0} / 更新 ${s.updated || 0} / 未匹配 ${s.unmatched || 0}。`
        + `已回到 A3 软停，请复核后点「批准 / 放行」。`, "ok");

    log("上传失败：" + e.message, "err");
    flash("上传失败：" + e.message, "err");

    setBusy(false);

  }
}

  STAGE_ORDER.forEach(([blk, sid, lbl]) => {

      cls = "done";
      if (p.awaiting) cls = (p.status === "await_human" ? (STATE.await.kind === "gate" ? "gate await" : "await") : "done");
    }
    li.className = cls;
    const tag = p ? (p.awaiting ? (STATE.await.kind === "gate" ? "🔴 红线" : "⏸ 待确认") : "✓") : "—";
    li.innerHTML = `<span class="dot"></span><span class="lbl">${lbl}</span><span class="tag">${tag}</span>`;
    li.onclick = () => {
      if (p && p.awaiting) renderNode();
      else if (p && (p.status === "completed" || p.status === "done")) viewStage(sid);

function renderPanel(p, ctx) {
  const data = p.path ? resolve(ctx, p.path) : ctx;
  let inner = "";
  if (p.kind === "object") {
    inner = `<div class="kv">` + (p.fields||[]).map(f => {
      let v = data ? data[f.path] : null;
      const alert = (f.alert_if_not && v !== f.alert_if_not) ? "alert" : "";
      return `<div class="k">${f.label}</div><div class="${alert}">${esc(v ?? "—")}</div>`;
    }).join("") + `</div>`;
  } else if (p.kind === "dicttable") {
    const rows = data ? Object.entries(data) : [];
    inner = `<table class="grid"><tr><th>项</th><th>值</th></tr>` +
      rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + `</table>`;
  } else if (p.kind === "textarea") {
    const val = data ?? "";
    inner = p.editable
      ? `<textarea data-rk="${p.revision_key}">${esc(val)}</textarea>`
      : `<div class="json">${esc(val)}</div>`;
  } else if (p.kind === "rowlist") {
    inner = renderRowlist(p, data, ctx);
    // A3 初筛裁决面板：在列表上方挂 Excel 下载/上传工具栏
    if (p.filter_by === "decision") {
      inner = `<div class="rl-xlsx-bar">
          <button class="btn-mini" onclick="a3DownloadExcel()">⬇ 下载裁决表 (Excel)</button>
          <label class="btn-mini file">⬆ 上传更新
            <input type="file" accept=".xlsx" onchange="a3UploadExcel(this)" style="display:none">
          </label>
          <span class="rl-xlsx-hint">在 Excel 中改「裁决 / 理由」两列后上传，自动按 DOI / 标题匹配回写</span>
        </div>` + inner;
    }
  } else if (p.kind === "a4documents") {
    inner = renderA4Documents();
  } else if (p.kind === "a4uploads") {
    inner = renderA4Uploads();
  } else if (p.kind === "json") {
    inner = `<div class="json">${esc(JSON.stringify(data, null, 2))}</div>`;
  } else {
    inner = `<div class="json">${esc(JSON.stringify(data, null, 2))}</div>`;
  }
  return `<div class="panel"><div class="pl">${p.label}</div>${inner}</div>`;
}

function renderRowlist(p, data, ctx) {
  _LAST_ROWLIST = {rk: p.revision_key, p, data};
  if (!Array.isArray(data) || !data.length)
    return `<div class="empty">（无数据）</div>`;
  const rk = p.revision_key;
  const fb = p.filter_by, fopts = p.filter_options;
  const cols = p.columns === "auto"
    ? Object.keys(data[0]).map(k => ({path:k, label:k, type:"text", editable:false}))
    : p.columns;
  const ncol = cols.length;
  let head = "";
  if (fb && fopts) {
    head += `<div class="rl-filter">` +
      fopts.map(([v, l]) => {
        const arg = (typeof v === "string") ? "'" + v + "'" : v;
        return `<button type="button" class="rlf-btn ${A3_FILTER === v ? "active" : ""}" onclick="a3SetFilter(${arg})">${l}</button>`;
      }).join("") +
      `<span class="rl-filter-hint">点筛选按钮可单独查看；再次点击取消</span></div>`;
  }
  const body = data.map((row, i) => {
    const fv = fb ? (row[fb] ?? "") : "";
    if (fb && A3_FILTER && String(fv) !== String(A3_FILTER)) return "";  // 筛选不匹配：跳过整行（含详情）
    const dec = draftCell(rk, i, "decision", row.decision);
    const cls = "rl-row " + (dec ? "dec-" + dec : "");
    const cells = cols.map(c => {
      const raw = draftCell(rk, i, c.path, row[c.path]);
      if (c.editable && c.type === "bool")
        return `<td><input type="checkbox" data-rk="${rk}" data-i="${i}" data-k="${c.path}" ${raw ? "checked" : ""}></td>`;
      if (c.editable && c.type === "select")
        return `<td><select data-rk="${rk}" data-i="${i}" data-k="${c.path}" class="rl-sel rl-sel-${raw}">` +
               (c.options || []).map(([v, l]) => `<option value="${esc(v)}" ${String(raw) === String(v) ? "selected" : ""}>${esc(l)}</option>`).join("") +
               `</select></td>`;
      if (c.editable)
        return `<td><input type="text" data-rk="${rk}" data-i="${i}" data-k="${c.path}" value="${esc(raw ?? "")}"></td>`;
      if (c.type === "list") return `<td>${esc(Array.isArray(raw) ? raw.join(", ") : (raw ?? "—"))}</td>`;
      if (c.type === "link") return `<td>${raw ? `<a href="${esc(raw)}" target="_blank" rel="noopener">链接</a>` : "—"}</td>`;
      if (c.type === "bool") return `<td>${raw ? "是" : "否"}</td>`;
      if (c.expand)
        return `<td class="rl-title"><span class="rl-toggle ${A3_EXPANDED.has(i) ? "open" : ""}" onclick="a3ToggleExpand(${i})">${A3_EXPANDED.has(i) ? "▾" : "▸"}</span>` +
               `<a class="rl-title-link" onclick="a3ToggleExpand(${i})">${esc(raw ?? "—")}</a></td>`;
      return `<td>${esc(raw ?? "—")}</td>`;
    }).join("");
    let det = "";
    const df = p.detail_fields || [];
    if (df.length) {
      const open = A3_EXPANDED.has(i);
      const din = df.map(d => {
        const v = draftCell(rk, i, d.path, row[d.path]);
        let valHtml;
        if (d.type === "list") valHtml = esc(Array.isArray(v) ? v.join(", ") : (v ?? "—"));
        else if (d.type === "link") valHtml = v ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : "—";
        else if (d.type === "bool") valHtml = v ? "是" : "否";
        else valHtml = esc(v ?? "—");
        return `<div class="rl-df ${d.type === "para" ? "wide" : ""}"><span class="rl-df-k">${esc(d.label)}</span><span class="rl-df-v">${valHtml}</span></div>`;
      }).join("");
      det = `<tr class="rl-detail ${open ? "open" : ""}"><td colspan="${ncol}"><div class="rl-detail-inner">${din}</div></td></tr>`;
    }
    return `<tr class="${cls}" data-i="${i}">${cells}</tr>${det}`;
  }).join("");
  const table = `<table class="grid rl"><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr>${body}</table>`;
  return `<div id="rowlist-${rk}">${head}${table}</div>`;
}

function collectDraft(el) {
  clearFlash();   // 用户开始编辑 → 旧提示自动消失
  const rk = el.dataset.rk;
  if (el.type === "checkbox") {
    const arr = DRAFT[rk] ? DRAFT[rk].slice() : (resolve({editable: STATE.await.editable_payload, nha: STATE.await.nha, stage: STATE.await.stage_result}, el.dataset.rk === "screened" ? "nha.decisions" : "editable." + rk) || []).slice();

    DRAFT[rk] = arr;
  } else if (el.dataset.i !== undefined) {  // rowlist text
    const arr = DRAFT[rk] ? DRAFT[rk].slice() : (resolve({editable: STATE.await.editable_payload, nha: STATE.await.nha, stage: STATE.await.stage_result}, el.dataset.rk === "screened" ? "nha.decisions" : "editable." + rk) || []).slice();

// ---------- A4 实时预览（SSE 流式消费） ----------
function startA4Preview() {
  const btn = $("#btn-a4prev"); if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = "⏳ 抽取进行中…（请勿重复点击）";
  const listEl = $("#a4prev-list"); listEl.innerHTML = "";
  const statusEl = $("#a4prev-status"); statusEl.style.display = "inline-block";
  statusEl.textContent = "连接中…";

  function addRow(ev) {
    const id = "a4r-" + ev.index;
    let el = document.getElementById(id);
    if (!el) {
      el = document.createElement("div"); el.id = id; el.className = "a4row";
      el.innerHTML = `<span class="a4dot"></span><span class="a4title"></span>
        <span class="a4badge pill"></span><span class="a4reason"></span>`;
      listEl.appendChild(el);
    }
    const badge = el.querySelector(".a4badge");
    const reason = el.querySelector(".a4reason");
    const title = el.querySelector(".a4title");
    title.textContent = (ev.title || ("#" + ev.index)) + (ev.doi ? ` (${ev.doi})` : "");
    const dot = el.querySelector(".a4dot");
    const MAP = {
      start:               ["#94a3b8", "排队中",            "#94a3b8"],
      downloading:         ["var(--accent)", "下载中",      "#2563eb"],
      extracting:          ["var(--soft)", "抽取中",       "#f59e0b"],
      extracted:           ["var(--green)", "✓ 已抽取",    "#16a34a"],
      downloaded_no_extract:["var(--soft)", "已下载·待补抽取", "#f59e0b"],
      skip:                ["var(--muted)", "跳过(未过门控)", "#6b7785"],
      deferred:            ["var(--muted)", "延后(配额)",    "#6b7785"],
      failed:              ["var(--red)", "✕ 需上传",      "#dc2626"],
    };
    const m = MAP[ev.event] || ["#94a3b8", ev.event, "#94a3b8"];
    badge.style.background = m[0] + "22"; badge.style.color = m[0];
    badge.textContent = m[1]; dot.style.background = m[2];
    if (ev.event === "extracted")
      reason.textContent = `2×2 行 ${ev.n_tworows} / 候选 ${ev.n_rows || 0}`;
    else if (ev.reason) reason.textContent = ev.reason;
    el.scrollIntoView({block: "nearest"});
  }

  function renderA4Upload(need) {
    let box = $("#a4prev-upload");
    if (!box) {
      box = document.createElement("div"); box.id = "a4prev-upload"; box.className = "panel";
      box.innerHTML = `<div class="pl">⚠️ 需用户上传 PDF（下载失败 / 付费墙 / 无入口）</div>
        <div id="a4up-list"></div>`;
      $("#center").appendChild(box);
    }
    $("#a4up-list").innerHTML = need.map(n =>
      `<div class="a4row"><span class="a4badge pill red">上传</span>
       <span class="a4title">${esc(n.title || "")}</span>
        <span class="a4reason">${esc(n.reason || "")}</span></div>`).join("");
  }


  setBusy(true, "下载并抽取");
  log("▶ 开始下载全文 PDF 并抽取数据…");
  streamPost("/api/a4_preview", {session_path: STATE.session.path}, {
    onEvent(ev) {
      if (ev.event === "done") {
        const r0 = ev.result || {};
        statusEl.textContent = `完成 · 下载 ${r0.n_downloaded} / 抽取 ${r0.n_extracted} / 待上传 ${(r0.needs_user_upload||[]).length}`;
        log(`✓ 下载并抽取完成 · 下载 ${r0.n_downloaded} / 抽取 ${r0.n_extracted} / 待上传 ${(r0.needs_user_upload||[]).length}`, "ok");
        // 重新载入会话（a4 结果已落盘），渲染逐篇文档 + 待上传面板
        fetch(apiUrl("/api/session?path=" + encodeURIComponent(STATE.session.path)))
          .then(r => r.json()).then(s => { STATE = s; renderNode(); })
          .catch(e => log("重载会话失败：" + e, "err"));
      } else if (ev.event === "error") {
        statusEl.textContent = "错误"; log("✕ " + ev.message, "err"); flash(ev.message, "err");
      } else if (ev.event === "extracted" || ev.event === "failed") {
        addRow(ev);
        log(`  #${ev.index} ${ev.event === "extracted" ? "✓ 已抽取" : "✕ 需上传"} ${ev.title || ev.doi || ""}`
            + (ev.reason ? " · " + ev.reason : ""), ev.event === "failed" ? "warn" : "info");
      } else { addRow(ev); }
    },
    onError(msg) { statusEl.textContent = "失败"; log("✕ " + msg, "err"); flash("预览失败：" + msg, "err"); }
  }).then(() => {
    if (btn) { btn.disabled = true; btn.textContent = "✓ 抽取完成（刷新页面可重跑）"; }
    setBusy(false);
  });
}

// ---- A4 上传已有 PDF（自动匹配 → 失败则手动指派）----
let A4_PENDING = [];  // 未能自动匹配的待指派文件队列

function reloadSession() {
  return fetch(apiUrl("/api/session?path=" + encodeURIComponent(STATE.session.path)))
    .then(r => r.json()).then(s => { STATE = s; renderNode(); });
}

function a4UploadAuto(el) {
  const files = Array.from(el.files || []); if (!files.length) return;
  el.value = "";
  files.forEach(f => {
    const fd = new FormData();
    fd.append("session_path", STATE.session.path);
    fd.append("file", f);
    fetch(apiUrl("/api/upload_pdf_auto"), { method: "POST", body: fd })
      .then(r => r.json()).then(j => {
        if (j.matched) {
          flash(`✓「${f.name}」已自动匹配到第 ${j.index + 1} 篇，抽取 ${j.n_tworows} 条 2×2 行`, "ok");
          log(`✓ 上传自动匹配：${f.name} → #${j.index + 1}`, "ok");
          reloadSession();
        } else {
          A4_PENDING.push(f);
          log(`⚠「${f.name}」未能自动匹配：${j.message || ""}`, "warn");
          a4ShowAssign(j.candidates || [], f);
        }
      }).catch(e => flash(`「${f.name}」上传失败：` + e, "err"));
  });
}

function a4ShowAssign(cands, f) {
  let box = $("#a4assign");
  if (!box) {
    box = document.createElement("div"); box.id = "a4assign";
    box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "6px";
    const live = $("#a4live");
    if (live && live.parentNode) live.parentNode.insertBefore(box, live);
    else return;
  }
  if (!cands.length) { flash(`「${f.name}」无待上传篇目可指派`, "warn"); return; }
  const rowId = "a4assign-" + A4_PENDING.indexOf(f);
  box.insertAdjacentHTML("beforeend",
    `<div class="a4up-card" id="${rowId}"><b>「${esc(f.name)}」未自动匹配 — 请指派：</b>
      <select class="a4assign-sel" data-f="${A4_PENDING.indexOf(f)}">` +
    cands.map(c => `<option value="${c.index}">#${c.index + 1} ${esc(String(c.title || "").slice(0, 70))}</option>`).join("") +
    `</select> <button class="btn-mini" onclick="a4AssignPending('${rowId}')">指派并抽取</button></div>`);
}

function a4AssignPending(rowId) {
  const row = document.getElementById(rowId);
  const sel = row && row.querySelector(".a4assign-sel");
  if (!sel) return;
  const fi = +sel.dataset.f, di = +sel.value;
  const f = A4_PENDING[fi]; if (!f) return;
  A4_PENDING[fi] = null;
  row.remove();
  const fd = new FormData();
  fd.append("session_path", STATE.session.path);
  fd.append("doc_index", di);
  fd.append("file", f);
  fetch(apiUrl("/api/upload_pdf"), { method: "POST", body: fd })
    .then(r => r.json()).then(j => {
      flash(`✓ 已指派到第 ${di + 1} 篇，抽取 ${j.n_tworows || 0} 条 2×2 行`, "ok");
      reloadSession();
    }).catch(e => flash("指派失败：" + e, "err"));
}

// ---------- A4 逐篇文档展示（提取 ↔ 原文对应） ----------
const A4DOC_STATUS = {
  extracted:            ["#16a34a", "✓ 已抽取"],
  downloaded_no_extract:["#f59e0b", "已下载·待补抽取"],
  needs_upload:         ["#dc2626", "待上传 PDF"],
  skip:                 ["#6b7785", "未过门控"],
  deferred:             ["#6b7785", "延后(配额)"],
  failed:               ["#dc2626", "失败"],
};

function renderA4Documents() {
  const res = (STATE.await && STATE.await.a4_result) || {};
  const docs = res.per_doc || [];
  if (!docs.length)
    return `<div class="empty">尚无逐篇结果。点上方「⬇ 下载全文并抽取数据」开始；也可到「待上传 / 补抽取 PDF」手动上传。</div>`;
  return docs.map((d, di) => {
    const st = A4DOC_STATUS[d.status] || ["#6b7785", d.status || "未知"];
    const rows = (d.rows && d.rows.length)
      ? d.rows.map((r, ri) => a4RowHtml(d, di, r, ri)).join("")
      : `<div class="empty">本篇未抽取到结构化 2×2 行（${esc(d.reason || "无原文 / 模板未命中")}）</div>`;
    return `<div class="a4doc" id="a4doc-${di}">
      <div class="a4doc-head">
        <span class="a4doc-idx">#${di + 1}</span>
        <span class="a4title">${esc(d.title || "(无标题)")}</span>
        <span class="pill" style="background:${st[0]}22;color:${st[0]}">${st[1]}</span>
        ${d.doi ? `<span class="a4doi">${esc(d.doi)}</span>` : ""}
        ${d.pdf ? `<span class="a4doi">📄 ${esc(d.pdf)}</span>` : ""}
      </div>
      <div class="a4doc-body">${rows}
        <div class="a4doc-actions">
        ${["needs_upload","downloaded_no_extract","failed"].includes(d.status)
          ? `<label class="btn-mini file">⬆ 上传此篇 PDF<input type="file" accept=".pdf" onchange="a4UploadPdf(${(d.index !== undefined ? d.index : di)}, this)" style="display:none"></label>`
          : ""}
        <button class="btn-mini" onclick="a4SaveDoc(${di})">💾 保存本篇修订</button>
      </div>
      </div>
    </div>`;
  }).join("");
}

function a4RowHtml(d, di, r, ri) {
  const cell = (k) => `<input class="a4cell" data-di="${di}" data-ri="${ri}" data-k="${esc(k)}" value="${esc(r[k] ?? "")}">`;
  const page = r.source_page;
  const viewBtn = (d.pdf && page)
    ? `<button class="btn-mini" onclick="a4ViewPage(${di}, ${page})">🔍 查看原文第 ${page} 页</button>` : "";
  return `<div class="a4row2">
    <div class="a4row2-k">${esc(r.study || ("R" + (ri + 1)))}
      ${r.measure ? `<span class="tag">${esc(r.measure)}</span>` : ""}
      ${r.confidence ? `<span class="tag2">${esc(r.confidence)}</span>` : ""}</div>
    <div class="a4row2-grid">
      <label>实验组 事件 a</label>${cell("ai")}${cell("bi")}
      <label>对照组 事件 c</label>${cell("ci")}${cell("di")}
      <label>效应量 TE</label>${cell("te")}${cell("sete")}
    </div>
    <div class="a4row2-anchor">${r.anchor ? `锚点：${esc(r.anchor)}` : ""} ${viewBtn}</div>
  </div>`;
}

function a4ViewPage(di, page) {
  const id = `a4page-${di}-${page}`;
  const ex = document.getElementById(id);
  if (ex) { ex.remove(); return; }
  const url = apiUrl(`/api/pdf_page?session_path=${encodeURIComponent(STATE.session.path)}&doc_index=${di}&page=${page}`);
  const box = document.createElement("div");
  box.id = id; box.className = "a4page";
  box.innerHTML = `<img src="${url}" alt="原文第 ${page} 页"><div class="a4page-cap">原文第 ${page} 页 · 上方对应行的提取数据即来自此页</div>`;
  const docEl = document.getElementById(`a4doc-${di}`);
  if (docEl) docEl.appendChild(box);
}

function a4SaveDoc(di) {
  const res = (STATE.await && STATE.await.a4_result) || {};
  const docs = res.per_doc || [];
  const doc = docs[di]; if (!doc) return;
  const rows = (doc.rows || []).map((r, ri) => {
    const nr = Object.assign({}, r);
    document.querySelectorAll(`[data-di="${di}"][data-ri="${ri}"]`).forEach(inp => {
      const k = inp.dataset.k, v = inp.value.trim();
      nr[k] = (["ai","bi","ci","di","te","sete"].includes(k) && v === "") ? null : v;
    });
    return nr;
  });
  const fd = new FormData();
  fd.append("session_path", STATE.session.path);
  fd.append("doc_index", di);
  fd.append("rows_json", JSON.stringify(rows));
  fetch(apiUrl("/api/a4_save_doc_edits"), { method: "POST", body: fd })
    .then(r => r.json()).then(j => {
      if (j.ok) flash(`✓ 第 ${di + 1} 篇修订已保存（${j.n_tworows} 条 2×2）`, "ok");
      else flash("保存失败：" + JSON.stringify(j), "err");
    }).catch(e => flash("保存失败：" + e, "err"));
}

function renderA4Uploads() {
  const res = (STATE.await && STATE.await.a4_result) || {};
  const docs = (res.per_doc || []).filter(d => d.status === "needs_upload" || d.status === "downloaded_no_extract");
  if (!docs.length)
    return `<div class="empty">无待上传 / 补抽取的 PDF（全部已抽取或自动跳过）。</div>`;
  return docs.map((d) => {
    const di = d.index;
    return `<div class="a4up-card">
      <div class="a4title">${esc(d.title || "(无标题)")} ${d.doi ? `<span class="a4doi">${esc(d.doi)}</span>` : ""}</div>
      <div class="a4reason" style="max-width:none;text-align:left;margin:4px 0">${esc(d.reason || "")}</div>
      <label class="btn-mini file">⬆ 上传此篇 PDF
        <input type="file" accept=".pdf" onchange="a4UploadPdf(${di}, this)" style="display:none"></label>
      <span id="a4up-status-${di}"></span>
    </div>`;
  }).join("");
}

function a4UploadPdf(di, el) {
  const f = el.files && el.files[0]; if (!f) return;
  const st = document.getElementById(`a4up-status-${di}`);
  if (st) st.textContent = "上传并抽取中…";
  const fd = new FormData();
  fd.append("session_path", STATE.session.path);
  fd.append("doc_index", di);
  fd.append("file", f);
  fetch(apiUrl("/api/upload_pdf"), { method: "POST", body: fd })
    .then(r => r.json()).then(j => {
      if (j.message) {
        if (st) st.textContent = "✓ " + j.message;
        flash("✓ " + j.message, "ok");
        return fetch(apiUrl("/api/session?path=" + encodeURIComponent(STATE.session.path)))
          .then(r => r.json()).then(s => { STATE = s; renderNode(); });
      }
      if (st) st.textContent = "✕ " + JSON.stringify(j);
      flash("上传失败：" + JSON.stringify(j), "err");
    }).catch(e => { if (st) st.textContent = "✕ " + e; flash("上传失败：" + e, "err"); });
}

function renderAudit() {
  const a = $("#audit"); if (!STATE || !STATE.audit.length) { a.innerHTML = '<span class="empty">暂无决策</span>'; return; }
  a.innerHTML = STATE.audit.slice().reverse().map(d =>
    `<div class="row"><span class="a">${esc(d.action)}</span> · ${esc(d.stage_id)}
     <div class="meta">${esc(d.decided_at||"")}${d.note? " · "+esc(d.note):""}</div></div>`).join("");
}

function renderDone() {
  $("#center").innerHTML = `<div class="done-banner">✅ 流程已完成（Block C 终闸已放行）。
    稿件经 C1→C3→C4 全部通过。可在审计日志追溯每一处人工决策。</div>`;
}

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------- 底部信息栏：滚动显示后台输出 / 进度 ----------
let BUSY = 0, LOG_N = 0, TICK0 = 0, TICK_TMR = null;

function toggleLog() {
  const bar = document.getElementById("logbar");
  bar.classList.toggle("collapsed");
  const col = bar.classList.contains("collapsed");
  document.body.classList.toggle("log-collapsed", col);
  document.getElementById("logbar-toggle").textContent = col ? "▴ 展开" : "▾ 收起";
}
function log(msg, level) {
  const wrap = document.getElementById("log-lines");
  if (!wrap) return;
  const d = new Date();
  const ts = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join(":");
  const el = document.createElement("div");
  el.className = "logline " + (level || "info");
  el.innerHTML = `<span class="ts">${ts}</span><span class="msg"></span>`;
  el.querySelector(".msg").textContent = msg;      // textContent：后台文本不解析为 HTML
  wrap.appendChild(el);
  LOG_N++;
  document.getElementById("logbar-count").textContent = LOG_N + " 行";
  const bodyEl = document.getElementById("logbar-body");
  bodyEl.scrollTop = bodyEl.scrollHeight;          // 自动滚到最新一行
  while (wrap.children.length > 500) wrap.removeChild(wrap.firstChild);  // 防止长跑撑爆 DOM
}
// 全局忙态：计数支持并发请求；忙时自动展开信息栏并起计时器
function setBusy(on, label) {
  BUSY = Math.max(0, BUSY + (on ? 1 : -1));
  const st = document.getElementById("logbar-status");
  if (BUSY > 0) {
    if (label) st.innerHTML = `<span class="pill soft">⏳ ${esc(label)}</span>`;
    if (!TICK_TMR) {
      TICK0 = Date.now();
      TICK_TMR = setInterval(() => {
        const s = Math.floor((Date.now() - TICK0) / 1000);
        st.innerHTML = `<span class="pill soft">⏳ <span class="spin">◍</span> 运行中 ${s}s</span>`;
      }, 1000);
      const bar = document.getElementById("logbar");
      if (bar.classList.contains("collapsed")) toggleLog();
    }
  } else if (TICK_TMR) {
    clearInterval(TICK_TMR); TICK_TMR = null;
    st.innerHTML = `<span class="pill">✓ 空闲</span>`;
  }
}

// SSE 通用消费（POST + 逐条回调）。A4 预览原本自己写一份解析，收敛到此处共用。
function streamPost(path, body, h) {
  return fetch(apiUrl(path), {method:"POST", headers:{"Content-Type":"application/json"},
                              body: JSON.stringify(body || {})})
    .then(r => {
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      const reader = r.body.getReader(); const dec = new TextDecoder();
      let buf = "";
      function pump() {
        return reader.read().then(({done, value}) => {
          if (done) return;
          buf += dec.decode(value, {stream: true});
          let idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
            const line = chunk.split("\n").find(l => l.startsWith("data:"));
            if (!line) continue;
            let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
            if (h.onEvent) h.onEvent(ev);
          }
          return pump();
        });
      }
      return pump();
    })
    .catch(e => {
      const msg = (e instanceof TypeError)
        ? "无法连接后端（" + e.message + "）。请通过 " + WB_BASE + "/ 打开工作台，不要直接双击 HTML。"
        : e.message;
      if (h.onError) h.onError(msg);
    });
}

// ---------- 初始化 ----------
$("#btn-new").onclick = () => { STATE = null; location.hash = ""; renderStart(); };
window.addEventListener("hashchange", () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) loadSession(h); else { STATE = null; render(); }
});
window.addEventListener("DOMContentLoaded", () => {
  log("就绪。发起流程后，后台输出与进度会实时显示在这里。");
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) loadSession(h); else renderStart();
});
</script>
