<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" style="background:transparent;">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 漏斗图基底：三层同心圆（占画布 ~82%，左右留白收紧） -->
  <circle cx="100" cy="92" r="80" fill="#EEEDFE"/>
  <circle cx="100" cy="92" r="60" fill="#CECBF6"/>
  <circle cx="100" cy="92" r="40" fill="#AFA9EC"/>

  <!-- 漏斗三角（funnel），apex 朝上 -->
  <path d="M32 150 L168 150 L100 26 Z" fill="#534AB7" stroke="#3C3489" stroke-width="2" stroke-linejoin="round"/>
  <line x1="100" y1="26" x2="32" y2="150" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>
  <line x1="100" y1="26" x2="168" y2="150" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>

  <!-- 森林图研究方块（白底紫框，叠在内侧圆） -->
  <rect x="72" y="74" width="56" height="10" rx="2" fill="#FFFFFF" stroke="#3C3489" stroke-width="1.4"/>
  <rect x="72" y="90" width="56" height="10" rx="2" fill="#FFFFFF" stroke="#3C3489" stroke-width="1.4"/>
  <rect x="72" y="106" width="56" height="10" rx="2" fill="#FFFFFF" stroke="#3C3489" stroke-width="1.4"/>

  <!-- 汇总估计菱形（pooled estimate） -->
  <polygon points="100,124 116,136 100,148 84,136" fill="#0F6E56" stroke="#04342C" stroke-width="2" stroke-linejoin="round"/>

  <!-- 词标：字号放大到 17（在 240px 显示下约 20px，原稿仅 ~6px） -->
  <text x="100" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#3C3489">Meta-Analysis</text>
</svg>
